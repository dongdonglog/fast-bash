name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 语法检查
        run: bash -n smon.sh install.sh
      - name: ShellCheck 静态检查
        run: |
          shellcheck smon.sh install.sh
        # web.py 为 Python，已在本地 py_compile 验证，此处跳过
      - name: 快速冒烟测试（JSON 输出）
        run: |
          bash -n smon.sh
          python3 - <<'EOF'
          import ast
          ast.parse(open('web.py').read())
          print("web.py 语法 OK")
          EOF
